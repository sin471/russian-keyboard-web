<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a237e">
  <meta name="description" content="ロシア語キリル文字入力用Webキーボード。スマホ・PCでロシア語を入力できます。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RU Keyboard">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>ロシア語キリル文字キーボード</title>
</head>
<body>
  <header>
    <span class="logo">Я</span>
    <h1>
      ロシア語キーボード
      <small>Russian Cyrillic Keyboard</small>
    </h1>
  </header>

  <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <p id="modal-title" class="modal-title">テキストをクリアしますか？</p>
      <p class="modal-body">入力した内容がすべて削除されます。</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="modal-cancel" type="button">キャンセル</button>
        <button class="modal-btn modal-btn-confirm" id="modal-confirm" type="button">クリア</button>
      </div>
    </div>
  </div>

  <div class="output-section">
    <div class="output-wrapper">
      <textarea
        id="output"
        placeholder="ここにロシア語が入力されます..."
        aria-label="入力テキスト"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        inputmode="none"
      ></textarea>
    </div>
    <div class="char-count" id="char-count">0 文字</div>
    <div class="output-actions">
      <button class="btn btn-copy" id="btn-copy" type="button">📋 コピー</button>
      <button class="btn btn-clear" id="btn-clear" type="button">🗑 クリア</button>
    </div>
  </div>

  <div class="keyboard-section">
    <div class="suggest-bar" id="suggest-bar" role="group" aria-label="予測候補"></div>
    <div class="keyboard" id="keyboard" role="group" aria-label="キリル文字キーボード"></div>
  </div>

  <div id="key-popup" aria-hidden="true"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
